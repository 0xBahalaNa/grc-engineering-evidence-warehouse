version: 2

models:
  - name: fct_findings
    description: |
      Unified findings mart — one row per finding at the six-field common core.
      Extension fields (enc_type, ports, CloudTrail event detail, policy attrs)
      remain in staging; join back to stg_* for source-specific detail.

      Joining dim_controls on (source, check_id) fans out: one finding mapped
      to N control rows returns N rows. That is intentional — control analysis
      is a join, not a denormalized column on the fact.

      Finding identity is per-source at staging (see contracts/_core.md
      ## Finding identity). This mart carries no uniqueness test: the six core
      columns are a union spine, not a natural key — e.g. two risky ports on one
      security group share check_id + resource_id at the core grain.

      Example — findings by control family:
        select c.control_id, count(*) as finding_count
        from fct_findings f
        join dim_controls c
          on f.source = c.source and f.check_id = c.check_id
        where c.framework = 'NIST 800-53 Rev 5'
          and c.control_id like 'SC-%'
        group by c.control_id
        order by c.control_id;

      Example — findings by status:
        select status, count(*) as finding_count
        from fct_findings
        group by status
        order by status;

      Example — confirm every finding carries the current run's stamp:
        select run_id, count(*) as finding_count
        from fct_findings
        group by run_id;
        -- Under single-run snapshot semantics this returns exactly one row
        -- (the provenance stamp for the load that built the mart).
    columns:
      - name: source
        tests: [not_null]
      - name: check_id
        tests: [not_null]
      - name: resource_id
        # Nullable: evidence_logger Sid-less statements normalize 'None' → NULL
        # in staging (D4 / #11). A missing Sid is absence of a subject id, not a
        # value — asserting not_null forced the data to state something false.
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PASS', 'WARN', 'FAIL']
      - name: collected_at
        tests: [not_null]
      - name: run_id
        tests: [not_null]
