name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"  # dbt-core 1.11.x cannot run on 3.14 (mashumaro); never "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Load fixtures into DuckDB
        run: |
          mkdir -p raw
          cp fixtures/*.json raw/
          python ingest/load_raw.py --raw-dir raw/

      - name: Build
        run: dbt build

      # Views only fail ELSE error()/bad SQL on SELECT — dbt build creating the
      # view is not enough (B3). Force a full read of each staging model.
      - name: Smoke-select staging views
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect("evidence_warehouse.duckdb", read_only=True)
          for model in (
              "stg_s3_audit",
              "stg_sg_audit",
              "stg_cloudtrail_audit",
              "stg_evidence_logger",
          ):
              con.execute(f"select * from main.{model}").fetchall()
              print(f"ok: {model}")
          PY
